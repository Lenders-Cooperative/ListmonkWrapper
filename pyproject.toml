[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listmonk-wrapper"
version = "1.0.0"
description = "Light Python wrapper for listmonk.app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Lenders Cooperative, a division of Summit Technology Group, Inc." }
]

dependencies = [
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = ["black", "isort", "pylint", "flake8", "flake8-isort", "xenon", "radon"]
test = ["pytest", "python-dotenv", "pytest-repeat"]

[project.urls]
Homepage = "https://pypi.org/project/listmonk-wrapper/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pylint.'MAIN']
max-line-length = 100

[tool.flake8]
max-line-length = 100
ignore = ["E501", "W503", "F403", "F405", "E203"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "venv"]
