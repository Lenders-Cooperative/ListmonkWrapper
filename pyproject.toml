[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listmonk-wrapper"
version = "0.1.5"
description = "Light Python wrapper for listmonk.app"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "Lenders Cooperative, a division of Summit Technology Group, Inc." }
]

dependencies = [
  "requests>=2.33.0",
  "urllib3>=2.6.3",
]

[project.optional-dependencies]
dev = ["black>=26.3.1", "isort", "pylint", "flake8", "flake8-isort", "xenon", "radon"]
test = ["pytest", "python-dotenv", "pytest-repeat"]

[project.urls]
Homepage = "https://pypi.org/project/listmonk-wrapper/"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.pylint.'MAIN']
max-line-length = 100

# NOTE: flake8 config lives in .flake8 (flake8 does not read pyproject.toml
# by default). Keep it there so running `flake8` outside pre-commit works.
